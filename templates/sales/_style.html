{% comment %}The few rules the sales forms share. Class NAMES come from base.html; this only lays out fields.{% endcomment %}
<style>
.sched td input.cell,.sched td select.cell{width:100%;box-sizing:border-box;}
.sched td:nth-child(2){min-width:180px;}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:14px;}
.facts .card{padding:10px 12px;}
.facts .k{font-size:13px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);}
.facts .v{font-size:14px;font-weight:600;color:var(--navy);margin-top:2px;}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.acts form{margin:0;display:inline;}
</style>

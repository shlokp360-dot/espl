{% comment %}The few rules the finance forms share. Class NAMES come from base.html; this only lays out fields.{% endcomment %}
<style>
.fform{display:grid;gap:12px;max-width:720px;}
.fform label{display:block;font-size:13px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin-bottom:3px;}
.fform input,.fform select,.fform textarea{width:100%;padding:6px 8px;border:1px solid #CBD2DC;border-radius:4px;font:inherit;font-size:12.5px;background:#fff;box-sizing:border-box;}
.fform .two{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.fform .three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.fform .foot{display:flex;gap:8px;align-items:center;}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:14px;}
.facts .card{padding:10px 12px;}
.facts .k{font-size:13px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);}
.facts .v{font-size:13px;font-weight:600;color:var(--navy);margin-top:2px;}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.acts form{margin:0;display:inline;}
h3.sec{font-size:13px;letter-spacing:.6px;text-transform:uppercase;color:var(--navy);margin:18px 0 6px;}
td input.cell{width:90px;box-sizing:border-box;}
</style>
